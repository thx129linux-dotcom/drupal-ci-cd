services:

  db:

    image: mariadb:11

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal

    volumes:
      - db:/var/lib/mysql

  drupal:

    build: .

    depends_on:
      - db

    ports:
      - "8080:80"

volumes:
  db: